name: check

env:
  DENO_VERSION: 2.x

on:
  push:
    branches:
      - main
  pull_request:

# A pull request only needs its latest commit checked. A run on main waits for
# the one before it to finish instead of stopping it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: format
        run: deno fmt --check

  misspell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # reviewdog reports its findings as a check run.
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: misspell
        uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
